    <circle cx="460" cy="239.5" r="56"/><circle cx="516" cy="239.5" r="56"/><circle cx="572" cy="239.5" r="56"/><circle cx="628" cy="239.5" r="56"/><circle cx="684" cy="239.5" r="56"/><circle cx="740" cy="239.5" r="56"/>
    <circle cx="488" cy="191" r="56"/><circle cx="544" cy="191" r="56"/><circle cx="600" cy="191" r="56"/><circle cx="656" cy="191" r="56"/><circle cx="712" cy="191" r="56"/>
