<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Flor da Vida — metade superior</title>
  <desc id="desc">Metade superior luminosa de uma Flor da Vida, identidade de abertura do portfólio Liquifinity.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="92%" r="56%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="3.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="topHalf"><rect x="340" y="0" width="520" height="288" rx="0"/></clipPath>
  </defs>

  <ellipse cx="600" cy="276" rx="315" ry="250" fill="url(#halo)"/>

