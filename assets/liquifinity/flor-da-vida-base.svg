<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-labelledby="title desc">
  <title id="title">Flor da Vida — metade inferior</title>
  <desc id="desc">Metade inferior da Flor da Vida usada como fechamento do perfil Liquifinity.</desc>
  <defs>
