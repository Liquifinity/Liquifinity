      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
